
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEXA ARENA | Ahtesham & Salman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nexa: {
                bg: '#030508', // Void Black
                panel: '#0B101B', // Deep Navy
                primary: '#7A3CFF', // Plasma Violet
                accent: '#00F6FF', // Cyber Cyan
                warning: '#FF3366', // Laser Red
                success: '#00FF99', // Matrix Green
                text: '#E0E6ED', // Titanium White
                muted: '#64748B' // Slate
              }
            },
            fontFamily: {
              sans: ['Rajdhani', 'sans-serif'], // Main UI font
              display: ['Orbitron', 'sans-serif'], // Headings
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #1f2937 1px, transparent 1px), linear-gradient(to bottom, #1f2937 1px, transparent 1px)",
            },
            animation: {
              'glitch': 'glitch 1s linear infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scanline': 'scanline 8s linear infinite',
            },
            keyframes: {
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scanline: {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '0% 100%' },
              }
            }
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #030508;
        color: #E0E6ED;
        overflow: hidden; /* Prevent native scroll, use custom containers */
      }
      
      /* Cinematic Scanline Overlay */
      .scanlines::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 2;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }

      .glass-pro {
        background: rgba(11, 16, 27, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      }
      
      .text-glow {
        text-shadow: 0 0 10px rgba(0, 246, 255, 0.5);
      }
      
      .text-glow-violet {
        text-shadow: 0 0 15px rgba(122, 60, 255, 0.6);
      }

      /* Custom Scrollbar for internal divs */
      .custom-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.02);
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background: #7A3CFF;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.4.2",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "three": "https://esm.sh/three@^0.169.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "gsap": "https://esm.sh/gsap@^3.12.5",
    "postprocessing": "https://esm.sh/postprocessing@6.36.0?deps=three@0.169.0",
    "@react-three/cannon": "https://esm.sh/@react-three/cannon@^6.6.0",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@0.10.12"
  }
}
</script>
</head>
  <body>
    <div id="root" class="h-screen w-screen scanlines"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
